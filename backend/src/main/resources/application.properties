# ====================================================================
# Multilingual Ticket Translator - Backend Application Properties
# ====================================================================

# Application Info
spring.application.name=multilingual-ticket-translator
server.port=8080

# Multipart File Upload Configuration (Allow up to 20MB ticket uploads)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Datasource Configuration (Defaults to in-memory H2, overrideable with MySQL env vars)
spring.datasource.url=${DB_URL:jdbc:h2:mem:ticketdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Logging
logging.level.root=INFO
logging.level.com.translator=DEBUG
